---
# Apply the complete desired Loopback state with cisco.ios.ios_config.
# Variables: router, interface_name, description, ipv4_address, netmask, shutdown
- name: Apply interface
  hosts: routers
  gather_facts: false
  tasks:
    - name: Configure interface
      cisco.ios.ios_config:
        parents: "interface {{ interface_name }}"
        lines:
          - "description {{ description }}"
          - "ip address {{ ipv4_address }} {{ netmask }}"
          - "{{ 'shutdown' if shutdown | bool else 'no shutdown' }}"
        defaults: true
